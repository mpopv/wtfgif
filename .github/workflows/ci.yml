name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-codec
        with:
          node-version: 22
      - run: npm run check

  node-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-codec
        with:
          node-version: 20.16.0
      - run: npm run build:wasm
      - run: npm test
      - run: npm run build
      - run: npm run validate:wasm-core
      - run: npm run test:package

  platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-codec
        with:
          node-version: 22
      - run: npm run build:wasm
      - run: npm test
      - run: npm run build
      - run: npm run validate:wasm-core
      - run: npm run test:conformance:independent

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-codec
        with:
          node-version: 22
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:wasm
      - run: npm run build
      - run: npm run test:conformance:browsers

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: rustup toolchain install nightly --profile minimal --no-self-update
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz decode and encode
        run: npm run fuzz:smoke
        env:
          FUZZ_RUNS: ${{ github.event_name == 'schedule' && '10000' || '500' }}
