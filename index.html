<!DOCTYPE html>
<html>
<head>
    <title>wtfgif vs omggif Performance Test</title>
</head>
<body>
    <h1>wtfgif vs omggif Performance Test</h1>
    <p>Head-to-head comparison of GIF decoding performance</p>
    <button id="runTests" onclick="runAllTests()">Run All Tests</button>
    <div id="overallProgress" style="display: none;">
        Progress: <span id="overallProgressBar">0%</span>
    </div>
    
    <div id="testGrid"></div>
    
    <div id="summary" style="display: none;">
        <h2>Summary</h2>
        <div id="summaryContent"></div>
    </div>

    <script src="node_modules/omggif/omggif.js"></script>
    <script>
        // Store omggif constructors before they get overwritten
        window.omggif = { GifReader: window.GifReader, GifWriter: window.GifWriter };
    </script>
    <script src="wtfgif-browser.js"></script>
    <script>
        const testFiles = [
            '18d30677-d255-4cc9-9933-c8d35306c1d5.gif',
            'Clap-1x.gif',
            'Disappear Homer Simpson GIF.gif', 
            'Dramatic Chipmunk GIF.gif',
            'GIGACHAD-4x.gif',
            'NODDERS-2x.gif',
            'Proud Of You Yes GIF.gif',
            'catJAM-3x.gif',
            'excuseme.gif',
            'party_blob.gif',
            'partyparrot.gif',
            'tenor.gif'
        ];

        let testResults = [];

        async function loadGifData(filename) {
            const response = await fetch(`test/gifs/${filename}`);
            return new Uint8Array(await response.arrayBuffer());
        }

        async function loadFrameInfo(filename, gifData) {
            // Fallback: parse the GIF directly using wtfgif (more reliable)
            const r = new window.wtfgif.GifReader(gifData);
            const frames = Array.from({length: r.numFrames()}, (_, i) => r.frameInfo(i));
            return {
                width: r.width,
                height: r.height,
                numFrames: r.numFrames(),
                loopCount: typeof r.loopCount === 'function' ? r.loopCount() : null,
                frames
            };
        }

        function benchmarkDecoding(gifData, library, iterations = 100) {
            return new Promise((resolve, reject) => {
                const worker = new Worker('benchmark-worker.js');
                const testId = Math.random().toString(36);
                
                worker.onmessage = function(e) {
                    const { success, result, error } = e.data;
                    worker.terminate();
                    
                    if (success) {
                        resolve(result);
                    } else {
                        reject(new Error(error));
                    }
                };
                
                worker.onerror = function(error) {
                    worker.terminate();
                    reject(error);
                };
                
                // Send ArrayBuffer for better performance
                const ab = gifData.buffer.slice(gifData.byteOffset, gifData.byteOffset + gifData.byteLength);
                worker.postMessage({
                    gifData: ab,
                    library,
                    iterations,
                    testId
                }, [ab]);
            });
        }

        async function testSingleGif(filename, index, total) {
            console.log(`Testing ${filename}...`);
            
            const gifData = await loadGifData(filename);
            const frameInfo = await loadFrameInfo(filename, gifData);
            
            const testItem = document.createElement('div');
            testItem.innerHTML = `
                <div>${filename} [${frameInfo.width}x${frameInfo.height} ${frameInfo.numFrames}f ${(gifData.length / 1024).toFixed(0)}kb] <span id="progress-${index}">...</span></div>
                <div id="results-${index}"></div>
            `;
            
            document.getElementById('testGrid').appendChild(testItem);
            
            const progressSpan = document.getElementById(`progress-${index}`);
            const resultsDiv = document.getElementById(`results-${index}`);
            
            // Test omggif
            progressSpan.textContent = 'omg';
            const omggifResults = await benchmarkDecoding(gifData, 'omggif');
            
            // Test wtfgif
            progressSpan.textContent = 'wtf';
            const wtfgifResults = await benchmarkDecoding(gifData, 'wtfgif');
            
            progressSpan.textContent = 'done';
            
            const speedup = omggifResults.mean / wtfgifResults.mean;
            const isFaster = speedup > 1;
            
            const result = {
                filename,
                omggif: omggifResults,
                wtfgif: wtfgifResults,
                speedup,
                isFaster,
                frameInfo
            };
            
            testResults.push(result);
            
            resultsDiv.innerHTML = `omg:${omggifResults.mean.toFixed(0)}ms wtf:${wtfgifResults.mean.toFixed(0)}ms ${isFaster ? `+${speedup.toFixed(1)}x` : `-${(1/speedup).toFixed(1)}x`}`;
            
            // Update overall progress
            const overallProgress = ((index + 1) / total * 100).toFixed(0);
            document.getElementById('overallProgressBar').textContent = overallProgress + '%';
        }

        async function runAllTests() {
            document.getElementById('runTests').disabled = true;
            document.getElementById('overallProgress').style.display = 'block';
            document.getElementById('testGrid').innerHTML = '';
            document.getElementById('summary').style.display = 'none';
            testResults = [];
            
            for (let i = 0; i < testFiles.length; i++) {
                await testSingleGif(testFiles[i], i, testFiles.length);
            }
            
            showSummary();
            document.getElementById('runTests').disabled = false;
        }

        function showSummary() {
            const fasterCount = testResults.filter(r => r.isFaster).length;
            const avgSpeedup = testResults.reduce((sum, r) => sum + (r.isFaster ? r.speedup : 1/r.speedup), 0) / testResults.length;
            const totalFrames = testResults.reduce((sum, r) => sum + r.frameInfo.numFrames, 0);
            
            const best = testResults.sort((a,b) => b.speedup - a.speedup)[0];
            const summaryHtml = `${testResults.length} tests | wtf wins: ${fasterCount}/${testResults.length} (${(fasterCount/testResults.length*100).toFixed(0)}%) | avg: ${avgSpeedup.toFixed(1)}x ${fasterCount >= testResults.length/2 ? 'faster' : 'slower'} | ${totalFrames} frames | best: ${best.filename} ${best.speedup.toFixed(1)}x`;
            
            document.getElementById('summaryContent').innerHTML = summaryHtml;
            document.getElementById('summary').style.display = 'block';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Performance test ready. Click "Run All Tests" to begin.');
            console.log('Available constructors:');
            console.log('- omggif namespace:', typeof window.omggif);
            console.log('- wtfgif namespace:', typeof window.wtfgif);
            if (window.omggif) {
                console.log('- omggif.GifReader:', typeof window.omggif.GifReader);
            }
            if (window.wtfgif) {
                console.log('- wtfgif.GifReader:', typeof window.wtfgif.GifReader);
            }
        });
    </script>
</body>
</html>
