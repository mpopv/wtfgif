<text x="834" y="630" text-anchor="middle" font-size="12" fill="#687780">100 ms</text>
<line x1="1080" y1="140" x2="1080" y2="610" stroke="#e3e8eb"/>
<text x="1080" y="630" text-anchor="middle" font-size="12" fill="#687780">1 s</text>
<line x1="96" y1="610" x2="1080" y2="610" stroke="#e3e8eb"/>
<text x="86" y="614" text-anchor="end" font-size="12" fill="#687780">0 KiB</text>
<line x1="96" y1="516" x2="1080" y2="516" stroke="#e3e8eb"/>
