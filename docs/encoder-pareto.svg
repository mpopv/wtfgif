<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">GIF encoder speed against file size</title>
<desc id="desc">Scatter plot of median first-encode time on a logarithmic axis against output size for 10 encoder configurations on the 128×128×8 MakeEmoji animation. A dashed step line marks the Pareto frontier: wtfgif fastest, wtfgif smallest, image-q + omggif, gifenc. Labels give each configuration's time, size, and RGB PSNR.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172026">
<text x="40" y="46" font-size="25" font-weight="700">Encode time against file size</text>
<text x="40" y="74" font-size="14" fill="#51606a">MakeEmoji production sample, 128×128×8 · first encode in 40 fresh Node processes per encoder · down and left is better</text>
<text x="40" y="96" font-size="13" fill="#172026">wtfgif fastest is 34× faster than sharp effort 1 (1.01× the size, 6.7 dB higher PSNR). wtfgif smallest is 0.55× fastest's size; gifenc, the smallest other, is 0.94× that at 134× the time.</text>
<text x="40" y="116" font-size="12" fill="#b34b3f">Dashed line: Pareto frontier, where no other encoder is both faster and smaller · PSNR is RGB quality on opaque pixels, higher is better</text>
<line x1="96" y1="140" x2="96" y2="610" stroke="#e3e8eb"/>
<text x="96" y="630" text-anchor="middle" font-size="12" fill="#687780">0.1 ms</text>
<line x1="342" y1="140" x2="342" y2="610" stroke="#e3e8eb"/>
<text x="342" y="630" text-anchor="middle" font-size="12" fill="#687780">1 ms</text>
<line x1="588" y1="140" x2="588" y2="610" stroke="#e3e8eb"/>
<text x="588" y="630" text-anchor="middle" font-size="12" fill="#687780">10 ms</text>
<line x1="834" y1="140" x2="834" y2="610" stroke="#e3e8eb"/>
<text x="834" y="630" text-anchor="middle" font-size="12" fill="#687780">100 ms</text>
<line x1="1080" y1="140" x2="1080" y2="610" stroke="#e3e8eb"/>
<text x="1080" y="630" text-anchor="middle" font-size="12" fill="#687780">1 s</text>
<line x1="96" y1="610" x2="1080" y2="610" stroke="#e3e8eb"/>
<text x="86" y="614" text-anchor="end" font-size="12" fill="#687780">0 KiB</text>
<line x1="96" y1="516" x2="1080" y2="516" stroke="#e3e8eb"/>
<text x="86" y="520" text-anchor="end" font-size="12" fill="#687780">20 KiB</text>
<line x1="96" y1="422" x2="1080" y2="422" stroke="#e3e8eb"/>
<text x="86" y="426" text-anchor="end" font-size="12" fill="#687780">40 KiB</text>
<line x1="96" y1="328" x2="1080" y2="328" stroke="#e3e8eb"/>
<text x="86" y="332" text-anchor="end" font-size="12" fill="#687780">60 KiB</text>
<line x1="96" y1="234" x2="1080" y2="234" stroke="#e3e8eb"/>
<text x="86" y="238" text-anchor="end" font-size="12" fill="#687780">80 KiB</text>
<line x1="96" y1="140" x2="1080" y2="140" stroke="#e3e8eb"/>
<text x="86" y="144" text-anchor="end" font-size="12" fill="#687780">100 KiB</text>
<text x="588" y="654" text-anchor="middle" font-size="13" fill="#51606a">Median first-encode time (logarithmic)</text>
<text x="30" y="375" text-anchor="middle" font-size="13" fill="#51606a" transform="rotate(-90 30 375)">Output size</text>
