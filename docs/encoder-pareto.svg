<circle cx="506" cy="138" r="6" fill="#8a4fbf"/><text x="518" y="142" font-size="12" fill="#51606a">other Wasm builds</text>
<circle cx="736" cy="138" r="6" fill="#5c6b75"/><text x="748" y="142" font-size="12" fill="#51606a">JavaScript</text>
