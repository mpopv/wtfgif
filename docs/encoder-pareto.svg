<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">GIF encoder speed against file size</title>
<desc id="desc">Scatter plot of median first-encode time on a logarithmic axis against output size for 16 encoder configurations on the 128×128×8 MakeEmoji animation. A dashed step line marks the Pareto frontier: wtfgif fastest, wtfgif smallest, image-q + omggif, gifenc. Labels give each configuration's time, size, and RGB PSNR.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172026">
<text x="40" y="46" font-size="25" font-weight="700">Encode time against file size</text>
<text x="40" y="74" font-size="14" fill="#51606a">MakeEmoji production sample, 128×128×8 · first encode in 40 fresh Node processes per encoder · down and left is better</text>
<text x="40" y="96" font-size="13" fill="#172026">wtfgif fastest is 34× faster than sharp effort 1 (1.01× the size, 6.7 dB higher PSNR). wtfgif smallest is 0.55× fastest's size; gifenc, the smallest other, is 0.94× that at 139× the time.</text>
<text x="40" y="116" font-size="12" fill="#b34b3f">Dashed line: Pareto frontier, where no other encoder is both faster and smaller · PSNR is RGB quality on opaque pixels, higher is better</text>
<circle cx="46" cy="138" r="6" fill="#0d8f6f"/><text x="58" y="142" font-size="12" fill="#51606a">wtfgif (Rust/Wasm)</text>
