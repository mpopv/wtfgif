<text x="86" y="238" text-anchor="end" font-size="12" fill="#687780">80 KiB</text>
<line x1="96" y1="140" x2="1080" y2="140" stroke="#e3e8eb"/>
<text x="86" y="144" text-anchor="end" font-size="12" fill="#687780">100 KiB</text>
