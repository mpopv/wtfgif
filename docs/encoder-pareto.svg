<text x="124.61" y="263.16" font-size="13" font-weight="700" fill="#0d8f6f">wtfgif fastest</text>
<text x="124.61" y="277.16" font-size="11" fill="#51606a">0.69 ms · 73.2 KiB · 34.1 dB</text>
<text x="194.18" y="416.88" font-size="13" font-weight="700" fill="#0d8f6f">wtfgif smallest</text>
<text x="194.18" y="430.88" font-size="11" fill="#51606a">1.32 ms · 40.5 KiB · 34.1 dB</text>
