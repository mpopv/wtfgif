<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">GIF encoder speed against file size</title>
<desc id="desc">Scatter plot of median first-encode time on a logarithmic axis against output size for 10 encoder configurations on the 128×128×8 MakeEmoji animation. A dashed step line marks the Pareto frontier: wtfgif (independent frames), wtfgif, image-q + omggif, gifenc. Labels give each configuration's time, size, and RGB PSNR.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172026">
<text x="40" y="46" font-size="25" font-weight="700">Encode time against file size</text>
<text x="40" y="74" font-size="14" fill="#51606a">MakeEmoji production sample, 128×128×8 · first encode in 40 fresh Node processes per encoder · down and left is better</text>
<text x="40" y="96" font-size="13" fill="#172026">wtfgif is 35× faster than the next encoder, sharp effort 1, whose GIF is 1.01× the size with 6.7 dB higher PSNR. The smallest, gifenc, is 0.52× the size at 265× the time.</text>
<text x="40" y="116" font-size="12" fill="#b34b3f">Dashed line: Pareto frontier, where no other encoder is both faster and smaller · PSNR is RGB quality on opaque pixels, higher is better</text>
<line x1="96" y1="140" x2="96" y2="610" stroke="#e3e8eb"/>
<text x="96" y="630" text-anchor="middle" font-size="12" fill="#687780">0.1 ms</text>
