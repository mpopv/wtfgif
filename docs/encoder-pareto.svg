<text x="40" y="698" font-size="12" fill="#687780">sharp may use a palette per frame; wtfgif uses one palette without dithering. gif.js and gif.js.optimized render in browser Web Workers and do not run in Node.</text>
<text x="40" y="718" font-size="12" fill="#687780">Apple M3 Pro · Node v22.23.2 · wtfgif 3.3.0 · raw samples in benchmarks/pareto.json</text>
