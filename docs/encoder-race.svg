<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="538" viewBox="0 0 1060 538" role="img" aria-labelledby="title desc">
<title id="title">Browser GIF encoder speed in milliseconds</title>
<desc id="desc">Horizontal bar chart comparing wtfgif, gif.js, image-q + omggif, gif.js.optimized, gifenc, modern-gif. Bar length is median encode time in milliseconds, so shorter is faster. Labels also report emitted GIF size and relative slowdown versus wtfgif.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172026">
<text x="40" y="48" font-size="25" font-weight="700">Browser encode time: arbitrary RGBA images → GIF</text>
<text x="40" y="76" font-size="14" fill="#51606a">Median first real encode · 8 × 128×128 RGBA frames · 15 fresh Chrome processes · lower is better</text>
<line x1="250" y1="102" x2="250" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="250" y="98" text-anchor="middle" font-size="12" fill="#687780">0 ms</text>
<line x1="358" y1="102" x2="358" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="358" y="98" text-anchor="middle" font-size="12" fill="#687780">30 ms</text>
<line x1="466" y1="102" x2="466" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="466" y="98" text-anchor="middle" font-size="12" fill="#687780">60 ms</text>
<line x1="574" y1="102" x2="574" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="574" y="98" text-anchor="middle" font-size="12" fill="#687780">90 ms</text>
<line x1="682" y1="102" x2="682" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="682" y="98" text-anchor="middle" font-size="12" fill="#687780">120 ms</text>
<line x1="790" y1="102" x2="790" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="790" y="98" text-anchor="middle" font-size="12" fill="#687780">150 ms</text>
<text x="220" y="151" text-anchor="end" font-size="15" font-weight="700">wtfgif</text>
<rect x="250" y="130" width="4.1" height="28" rx="3" fill="#0d8f6f"/>
<text x="263.1" y="150" text-anchor="start" font-size="14" font-weight="700" fill="#172026">1.14 ms · 146.2 KiB · baseline</text>
<text x="220" y="201" text-anchor="end" font-size="15" font-weight="500">gif.js</text>
<rect x="250" y="180" width="346.32" height="28" rx="3" fill="#aab5bb"/>
<text x="605.32" y="200" text-anchor="start" font-size="14" font-weight="700" fill="#172026">96.2 ms · 79.0 KiB · 84.39× slower</text>
<text x="220" y="251" text-anchor="end" font-size="15" font-weight="500">image-q + omggif</text>
<rect x="250" y="230" width="354.01" height="28" rx="3" fill="#aab5bb"/>
<text x="613.01" y="250" text-anchor="start" font-size="14" font-weight="700" fill="#172026">98.3 ms · 38.4 KiB · 86.26× slower</text>
<text x="220" y="301" text-anchor="end" font-size="15" font-weight="500">gif.js.optimized</text>
<rect x="250" y="280" width="387.09" height="28" rx="3" fill="#aab5bb"/>
<text x="646.09" y="300" text-anchor="start" font-size="14" font-weight="700" fill="#172026">107.5 ms · 78.4 KiB · 94.32× slower</text>
<text x="220" y="351" text-anchor="end" font-size="15" font-weight="500">gifenc</text>
<rect x="250" y="330" width="449.08" height="28" rx="3" fill="#aab5bb"/>
<text x="708.08" y="350" text-anchor="start" font-size="14" font-weight="700" fill="#172026">124.7 ms · 38.2 KiB · 109.43× slower</text>
<text x="220" y="401" text-anchor="end" font-size="15" font-weight="500">modern-gif</text>
<rect x="250" y="380" width="483.98" height="28" rx="3" fill="#aab5bb"/>
<text x="742.98" y="400" text-anchor="start" font-size="14" font-weight="700" fill="#172026">134.4 ms · 42.1 KiB · 117.93× slower</text>
<text x="40" y="482" font-size="12" fill="#687780">Bar length = encode time · labels include emitted GIF size and relative slowdown · gif.js worker creation is timed</text>
<text x="40" y="504" font-size="12" fill="#687780">Google Chrome 151.0.7922.77 · Apple M3 Pro · every output decoded and checked</text>
</g>
</svg>
