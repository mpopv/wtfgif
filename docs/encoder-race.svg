<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" role="img" aria-labelledby="title desc">
<title id="title">Browser GIF encoder speed in milliseconds</title>
<desc id="desc">Horizontal bar chart comparing wtfgif, gif.js, image-q + omggif, gif.js.optimized, gifenc, modern-gif. Lower times are faster.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172026">
<text x="40" y="48" font-size="25" font-weight="700">Browser encode time: arbitrary RGBA images → GIF</text>
<text x="40" y="76" font-size="14" fill="#51606a">Median first real encode · 8 × 128×128 RGBA frames · 15 fresh Chrome processes · lower is better</text>
<line x1="250" y1="102" x2="250" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="250" y="98" text-anchor="middle" font-size="12" fill="#687780">0 ms</text>
<line x1="377" y1="102" x2="377" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="377" y="98" text-anchor="middle" font-size="12" fill="#687780">30 ms</text>
<line x1="504" y1="102" x2="504" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="504" y="98" text-anchor="middle" font-size="12" fill="#687780">60 ms</text>
<line x1="631" y1="102" x2="631" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="631" y="98" text-anchor="middle" font-size="12" fill="#687780">90 ms</text>
<line x1="758" y1="102" x2="758" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="758" y="98" text-anchor="middle" font-size="12" fill="#687780">120 ms</text>
<line x1="885" y1="102" x2="885" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="885" y="98" text-anchor="middle" font-size="12" fill="#687780">150 ms</text>
<text x="220" y="151" text-anchor="end" font-size="15" font-weight="700">wtfgif</text>
<rect x="250" y="130" width="6.07" height="28" rx="3" fill="#0d8f6f"/>
<text x="265.07" y="150" text-anchor="start" font-size="14" font-weight="700" fill="#172026">1.43 ms</text>
<text x="220" y="201" text-anchor="end" font-size="15" font-weight="500">gif.js</text>
<rect x="250" y="180" width="399.31" height="28" rx="3" fill="#aab5bb"/>
<text x="658.31" y="200" text-anchor="start" font-size="14" font-weight="700" fill="#172026">94.3 ms</text>
<text x="220" y="251" text-anchor="end" font-size="15" font-weight="500">image-q + omggif</text>
<rect x="250" y="230" width="410.04" height="28" rx="3" fill="#aab5bb"/>
<text x="669.04" y="250" text-anchor="start" font-size="14" font-weight="700" fill="#172026">96.9 ms</text>
<text x="220" y="301" text-anchor="end" font-size="15" font-weight="500">gif.js.optimized</text>
<rect x="250" y="280" width="457.16" height="28" rx="3" fill="#aab5bb"/>
<text x="716.16" y="300" text-anchor="start" font-size="14" font-weight="700" fill="#172026">108.0 ms</text>
<text x="220" y="351" text-anchor="end" font-size="15" font-weight="500">gifenc</text>
<rect x="250" y="330" width="524.51" height="28" rx="3" fill="#aab5bb"/>
<text x="783.51" y="350" text-anchor="start" font-size="14" font-weight="700" fill="#172026">123.9 ms</text>
<text x="220" y="401" text-anchor="end" font-size="15" font-weight="500">modern-gif</text>
<rect x="250" y="380" width="561.66" height="28" rx="3" fill="#aab5bb"/>
<text x="820.66" y="400" text-anchor="start" font-size="14" font-weight="700" fill="#172026">132.7 ms</text>
<text x="40" y="478" font-size="12" fill="#687780">Google Chrome 151.0.7922.77 · Apple M3 Pro · every output decoded and checked</text>
</g>
</svg>
