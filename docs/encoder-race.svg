<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="538" viewBox="0 0 1060 538" role="img" aria-labelledby="title desc">
<title id="title">Browser GIF encoder speed in milliseconds</title>
<desc id="desc">Horizontal bar chart comparing wtfgif, gif.js, image-q + omggif, gif.js.optimized, modern-gif, gifenc. Bar length is median encode time in milliseconds, so shorter is faster. Labels also report emitted GIF size and relative slowdown versus wtfgif.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172026">
<text x="40" y="48" font-size="25" font-weight="700">Browser encode time: arbitrary RGBA images → GIF</text>
<text x="40" y="76" font-size="14" fill="#51606a">Median first real encode · 8 × 128×128 RGBA frames · 15 fresh Chrome processes · lower is better</text>
<line x1="250" y1="102" x2="250" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="250" y="98" text-anchor="middle" font-size="12" fill="#687780">0 ms</text>
<line x1="358" y1="102" x2="358" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="358" y="98" text-anchor="middle" font-size="12" fill="#687780">25 ms</text>
<line x1="466" y1="102" x2="466" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="466" y="98" text-anchor="middle" font-size="12" fill="#687780">50 ms</text>
<line x1="574" y1="102" x2="574" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="574" y="98" text-anchor="middle" font-size="12" fill="#687780">75 ms</text>
<line x1="682" y1="102" x2="682" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="682" y="98" text-anchor="middle" font-size="12" fill="#687780">100 ms</text>
<line x1="790" y1="102" x2="790" y2="418" stroke="#e3e8eb" stroke-width="1"/>
<text x="790" y="98" text-anchor="middle" font-size="12" fill="#687780">125 ms</text>
<text x="220" y="151" text-anchor="end" font-size="15" font-weight="700">wtfgif</text>
<rect x="250" y="130" width="4.9" height="28" rx="3" fill="#0d8f6f"/>
<text x="263.9" y="150" text-anchor="start" font-size="14" font-weight="700" fill="#172026">1.13 ms · 146.2 KiB · baseline</text>
<text x="220" y="201" text-anchor="end" font-size="15" font-weight="500">gif.js</text>
<rect x="250" y="180" width="374.67" height="28" rx="3" fill="#aab5bb"/>
<text x="633.67" y="200" text-anchor="start" font-size="14" font-weight="700" fill="#172026">86.7 ms · 79.0 KiB · 76.41× slower</text>
<text x="220" y="251" text-anchor="end" font-size="15" font-weight="500">image-q + omggif</text>
<rect x="250" y="230" width="394.46" height="28" rx="3" fill="#aab5bb"/>
<text x="653.46" y="250" text-anchor="start" font-size="14" font-weight="700" fill="#172026">91.3 ms · 38.4 KiB · 80.45× slower</text>
<text x="220" y="301" text-anchor="end" font-size="15" font-weight="500">gif.js.optimized</text>
<rect x="250" y="280" width="433.17" height="28" rx="3" fill="#aab5bb"/>
<text x="692.17" y="300" text-anchor="start" font-size="14" font-weight="700" fill="#172026">100.3 ms · 78.4 KiB · 88.34× slower</text>
<text x="220" y="351" text-anchor="end" font-size="15" font-weight="500">modern-gif</text>
<rect x="250" y="330" width="524.79" height="28" rx="3" fill="#aab5bb"/>
<text x="783.79" y="350" text-anchor="start" font-size="14" font-weight="700" fill="#172026">121.5 ms · 42.1 KiB · 107.03× slower</text>
<text x="220" y="401" text-anchor="end" font-size="15" font-weight="500">gifenc</text>
<rect x="250" y="380" width="531.88" height="28" rx="3" fill="#aab5bb"/>
<text x="786" y="400" text-anchor="end" font-size="14" font-weight="700" fill="#172026">123.1 ms · 38.2 KiB · 108.48× slower</text>
<text x="40" y="482" font-size="12" fill="#687780">Bar length = encode time · labels include emitted GIF size and relative slowdown · gif.js worker creation is timed</text>
<text x="40" y="504" font-size="12" fill="#687780">Google Chrome 151.0.7922.77 · Apple M3 Pro · every output decoded and checked</text>
</g>
</svg>
