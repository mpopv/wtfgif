<text x="230" y="511" text-anchor="end" font-size="11" fill="#687780">128×128×8</text>
<rect x="260" y="478" width="159.29" height="27" rx="3" fill="#0d8f6f"/>
<text x="427.29" y="497" font-size="13" font-weight="700">234.25×</text>
<text x="260" y="519" font-size="11" fill="#51606a">0.299 ms wtfgif vs 70.050 ms baseline · output 1.96× baseline size</text>
<text x="260" y="532" font-size="11" fill="#687780">lossless RGB vs lossless RGB baseline</text>
