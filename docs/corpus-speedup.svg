<text x="230" y="567" text-anchor="end" font-size="11" fill="#687780">128×128×12</text>
<rect x="260" y="534" width="259.31" height="27" rx="3" fill="#0d8f6f"/>
<text x="527.31" y="553" font-size="13" font-weight="700">381.34×</text>
<text x="260" y="575" font-size="11" fill="#51606a">0.230 ms wtfgif vs 87.518 ms baseline · output 0.37× baseline size</text>
<text x="260" y="588" font-size="11" fill="#687780">lossless RGB vs lossless RGB baseline</text>
<text x="230" y="608" text-anchor="end" font-size="14" font-weight="600">Tiny animation</text>
<text x="230" y="623" text-anchor="end" font-size="11" fill="#687780">16×16×6</text>
<rect x="260" y="590" width="502.64" height="27" rx="3" fill="#0d8f6f"/>
<text x="770.64" y="609" font-size="13" font-weight="700">739.18×</text>
<text x="260" y="631" font-size="11" fill="#51606a">0.080 ms wtfgif vs 59.411 ms baseline · output 1.16× baseline size</text>
<text x="260" y="644" font-size="11" fill="#687780">28.43 dB vs 22.24 dB baseline</text>
<text x="230" y="664" text-anchor="end" font-size="14" font-weight="600">One-megapixel animation</text>
<text x="230" y="679" text-anchor="end" font-size="11" fill="#687780">512×512×4</text>
<rect x="260" y="646" width="136.25" height="27" rx="3" fill="#0d8f6f"/>
<text x="404.25" y="665" font-size="13" font-weight="700">200.36×</text>
<text x="260" y="687" font-size="11" fill="#51606a">2.937 ms wtfgif vs 588.417 ms baseline · output 22.42× baseline size</text>
<text x="260" y="700" font-size="11" fill="#687780">28.82 dB vs 7.94 dB baseline</text>
<text x="40" y="749" font-size="12" fill="#687780">Latency includes palette creation, mapping, LZW, and GIF assembly · every output has exact shape, timing, and binary alpha.</text>
<text x="40" y="771" font-size="12" fill="#687780">Apple M3 Pro · Node v22.23.2 · wtfgif 3.1.0 · no known palette, source cache, or reused result</text>
</g>
</svg>
