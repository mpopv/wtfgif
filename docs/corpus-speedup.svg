<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1170" viewBox="0 0 1120 1170" role="img" aria-labelledby="title desc">
<title id="title">wtfgif speedup over a JavaScript and a native GIF encoder</title>
<desc id="desc">For 10 RGBA workloads, paired bars on a logarithmic axis show how many times faster wtfgif's first encode is than image-q plus omggif and than sharp. Labels give all three median encode times, wtfgif's output size relative to each, and each encoder's RGB quality.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172026">
<text x="40" y="46" font-size="25" font-weight="700">wtfgif first-encode speedup on 10 RGBA workloads</text>
<text x="40" y="74" font-size="14" fill="#51606a">Cold-cache first real encode after initialization · 40 fresh Node processes per encoder · logarithmic axis, longer is faster</text>
<rect x="40" y="92" width="14" height="14" rx="2" fill="#0d8f6f"/>
<text x="62" y="104" font-size="13">vs image-q + omggif (JavaScript): 123×–585× (238× geometric mean)</text>
<rect x="40" y="114" width="14" height="14" rx="2" fill="#3b6fd6"/>
<text x="62" y="126" font-size="13">vs sharp (libvips), effort 1, no dither (native): 13×–137× (37× geometric mean)</text>
<line x1="250" y1="152" x2="250" y2="1076" stroke="#e3e8eb" stroke-width="1"/>
<text x="250" y="146" text-anchor="middle" font-size="11" fill="#687780">1×</text>
<line x1="500" y1="152" x2="500" y2="1076" stroke="#e3e8eb" stroke-width="1"/>
<text x="500" y="146" text-anchor="middle" font-size="11" fill="#687780">10×</text>
<line x1="750" y1="152" x2="750" y2="1076" stroke="#e3e8eb" stroke-width="1"/>
<text x="750" y="146" text-anchor="middle" font-size="11" fill="#687780">100×</text>
<line x1="1000" y1="152" x2="1000" y2="1076" stroke="#e3e8eb" stroke-width="1"/>
<text x="1000" y="146" text-anchor="middle" font-size="11" fill="#687780">1000×</text>
<text x="220" y="188" text-anchor="end" font-size="14" font-weight="600">MakeEmoji production sample</text>
<text x="220" y="204" text-anchor="end" font-size="11" fill="#687780">128×128×8</text>
<rect x="250" y="170" width="593.97" height="18" rx="3" fill="#0d8f6f"/>
<text x="851.97" y="184" font-size="12" font-weight="700">237.6×</text>
<rect x="250" y="192" width="387.31" height="18" rx="3" fill="#3b6fd6"/>
<text x="645.31" y="206" font-size="12" font-weight="700">35.4×</text>
<text x="250" y="228" font-size="11" fill="#51606a">0.631 ms wtfgif · 149.9 ms image-q + omggif · 22.3 ms sharp</text>
<text x="250" y="243" font-size="11" fill="#687780">wtfgif size 1.90× image-q + omggif, 0.99× sharp · RGB 34.1 dB wtfgif, 31.8 dB image-q + omggif, 40.8 dB sharp</text>
<text x="220" y="280" text-anchor="end" font-size="14" font-weight="600">Photographic animation</text>
<text x="220" y="296" text-anchor="end" font-size="11" fill="#687780">128×96×8</text>
<rect x="250" y="262" width="561.48" height="18" rx="3" fill="#0d8f6f"/>
<text x="819.48" y="276" font-size="12" font-weight="700">176.2×</text>
<rect x="250" y="284" width="368.92" height="18" rx="3" fill="#3b6fd6"/>
<text x="626.92" y="298" font-size="12" font-weight="700">29.9×</text>
<text x="250" y="320" font-size="11" fill="#51606a">0.421 ms wtfgif · 74.1 ms image-q + omggif · 12.6 ms sharp</text>
<text x="250" y="335" font-size="11" fill="#687780">wtfgif size 1.52× image-q + omggif, 1.35× sharp · RGB 38.2 dB wtfgif, 38.6 dB image-q + omggif, 49.7 dB sharp</text>
<text x="220" y="372" text-anchor="end" font-size="14" font-weight="600">Pixel art</text>
